# Pi-VPN server (docs/pi-vpn.md).  Paths are relative to /etc/pivpn (the
# mounted data directory).  Copied there by pivpn-init; edit the copy.
port 1194
proto udp
dev pivpn
dev-type tun
topology subnet
server 10.8.0.0 255.255.0.0          # 10.8.0.N = site Pis, 10.8.255.x = engineers
route 10.100.0.0 255.255.0.0         # NETMAP'd site LANs (iroute per site in ccd)

# every client MUST have a ccd file (fixed ifconfig-push); unknown certs are refused
client-config-dir ccd
ccd-exclusive

ca   pki/ca.crt
cert pki/issued/server.crt
key  pki/private/server.key
dh   none
crl-verify pki/crl.pem
tls-crypt-v2 tc2-server.key
tls-version-min 1.2
data-ciphers CHACHA20-POLY1305:AES-256-GCM:AES-128-GCM   # server order wins; ChaCha is faster on a Pi 3B (no AES instructions)

keepalive 10 60
persist-key
persist-tun
# drop to the data directory's owner, so ccd/ and the CRL stay readable on reconnects
user pivpn
group pivpn
status /tmp/pivpn-status.log 60
verb 3
