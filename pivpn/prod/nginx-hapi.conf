# /etc/nginx/snippets/hapi.conf on prod, included in the 443 server block of
# sites-available/grafana.conf (pivpn/prod/install.sh)

# site boxes from the HAMON image enrol here (hapi-enrol-server.py; it never signs)
location /hapi-enrol/ {
    limit_req zone=hapienrol burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8095;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# the HAMON image for integrators: one login each (hapi-image-user.sh)
location = /hapi-image { return 301 /hapi-image/; }
location /hapi-image/ {
    alias /var/www/hapi-image/;
    auth_basic "HAMON site box image";
    auth_basic_user_file /etc/nginx/hapi-image.htpasswd;
    autoindex on;
    autoindex_exact_size off;
}
